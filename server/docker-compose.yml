# Casino sur le NAS : le serveur + un petit conteneur Tailscale qui le publie en HTTPS (Funnel),
# sans ouvrir aucun port sur la box. Lancer depuis la racine du dépôt :
#   docker compose -f server/docker-compose.yml up -d --build
name: casino
services:
  casino:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: casino-serveur:latest
    restart: unless-stopped
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - ./data:/data
      - ./secrets/firebase.json:/run/secrets/firebase.json:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 1.0
    network_mode: service:tailscale   # joignable uniquement à travers Tailscale (aucun port publié)
    depends_on: [tailscale]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "3" } }

  tailscale:
    image: tailscale/tailscale:stable
    hostname: casino
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    mem_limit: 128m
    logging: { driver: json-file, options: { max-size: "5m", max-file: "3" } }
