      <rect x="-160" y="-22" width="46" height="44" rx="8"/><rect x="114" y="-22" width="46" height="44" rx="8"/>
      <g transform="rotate(45)"><rect x="-22" y="-160" width="44" height="46" rx="8"/><rect x="-22" y="114" width="44" height="46" rx="8"/><rect x="-160" y="-22" width="46" height="44" rx="8"/><rect x="114" y="-22" width="46" height="44" rx="8"/></g>
    </g>
    <circle r="112" fill="none" stroke="url(#gold)" stroke-width="8" stroke-dasharray="14 10"/>
    <circle r="98" fill="#24176b"/>
